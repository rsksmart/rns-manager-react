name: Github Pages Deploy

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://rsksmart.github.io/rns-manager-react/

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4 # persist-credentials must be false in most cases for the deployment to work correctly.
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install and Build for Testnet 🔧 # This example project is built using npm and outputs the result to the 'build' folder. Replace with the commands required to build your project, or remove this step entirely if your site is pre-built.
        run: |
          yarn install --frozen-lockfile --network-timeout 100000 || yarn install --frozen-lockfile --network-timeout 100000 || yarn install --frozen-lockfile --network-timeout 100000
          export VITE_GIT_HASH=${{ github.sha }}
          yarn build:ghpages

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.6.8
        with:
          BRANCH: gh-pages # The branch the action should deploy to.
          FOLDER: build # The folder the action should deploy.
          CLEAN: true # Automatically remove deleted files from the deploy branch
